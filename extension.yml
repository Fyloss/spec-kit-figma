schema_version: "1.0"

extension:
  id: figma
  name: "Spec Kit Figma"
  version: "2.0.0"
  description: "Grounds SpecKit spec/plan/tasks in Figma design context via REST or MCP, on macOS/Linux/Windows."
  author: "Fyloss"
  repository: "https://github.com/Fyloss/spec-kit-figma"
  license: MIT
  homepage: "https://github.com/Fyloss/spec-kit-figma"

requires:
  # Raised from ">=0.1.0" for /speckit.converge, whose command template — and
  # therefore its before_converge / after_converge hook points — first ships in
  # SpecKit v0.11.2. Every other hook this extension registers has existed far
  # longer; converge is the only reason for the floor.
  speckit_version: ">=0.11.2"
  tools:
    - name: git
      required: true
    # POSIX toolchain (macOS/Linux) — runs scripts/bash/*.sh.
    # Not required on Windows, where the PowerShell ports replace all three.
    - name: bash
      required: false
    - name: curl
      required: false
    - name: jq
      required: false
    # Windows toolchain — runs scripts/powershell/*.ps1 with PowerShell 7+
    # (built-in JSON + HTTP: no curl, no jq). Not required on macOS/Linux.
    - name: pwsh
      required: false

provides:
  commands:
    - name: speckit.figma.config
      file: commands/speckit.figma.config.md
      description: "Configure the SpecKit Figma extension for this workspace and validate connectivity before any spec/plan/tasks run. Selects the REST engine (portable, CI-friendly) or the MCP engine, which yields more faithful mockup implementation."

    - name: speckit.figma.update
      file: commands/speckit.figma.update.md
      description: "Update an already-installed Figma extension to a newer version fetched from the official repository: re-sync the helper scripts, templates, design-rules constitution and hooks, re-register the slash-commands, and report old -> new. Idempotent; preserves figma.projects.config.json and needs no uninstall."

    - name: speckit.figma.ensure
      file: commands/speckit.figma.ensure.md
      description: "Automatically refresh the Figma design context before spec/plan/tasks generation, and render the ready-to-paste design section so it is integrated regardless of agent model. A Figma link pasted in the feature input is what makes a run a design run: with none, the command is a no-op that adds nothing to the document. Invoked by the before_specify/before_plan/before_tasks hooks."

    - name: speckit.figma.introspect
      file: commands/speckit.figma.introspect.md
      description: "Autonomously introspect the mapped Figma pages for the target package and produce design-grounded context for spec/plan/tasks."

    - name: speckit.figma.verify
      file: commands/speckit.figma.verify.md
      description: "After generation, verify the Figma design section was integrated into spec/plan/tasks when a mockup was detected, and self-correct if missing. Strict mode (--strict / figma.verifyStrict) makes it a CI gate."

    - name: speckit.figma.drift
      file: commands/speckit.figma.drift.md
      description: "Report whether the Figma file changed after the feature's spec was generated, by comparing the lastModified recorded in the section marker with the current snapshot. Runs after /speckit.analyze; safe no-op when the feature has no design section."

hooks:
  before_specify:
    command: speckit.figma.ensure
    optional: false
    description: "Automatically refresh and inject Figma design context (incl. direct links in the feature input) before specification generation; safe no-op when Figma does not apply"

  before_plan:
    command: speckit.figma.ensure
    optional: false
    description: "Automatically refresh and inject the Figma design plan section before plan generation; safe no-op when Figma does not apply. Mandatory (optional: false) so the step is auto-executed and the agent cannot decline it."

  before_tasks:
    command: speckit.figma.ensure
    optional: false
    description: "Automatically refresh and inject Figma design context (incl. direct links in the feature input) before task generation; safe no-op when Figma does not apply"

  before_analyze:
    command: speckit.figma.ensure
    optional: false
    description: "Refresh the Figma design context before the consistency analysis, so analyze reasons over the same creative the documents were generated from; safe no-op when Figma does not apply"

  before_converge:
    command: speckit.figma.ensure
    optional: false
    description: "Refresh the Figma design context before convergence. /speckit.converge assesses the codebase against spec/plan/tasks and APPENDS the remaining unbuilt work to tasks.md — it is a task-generating phase, like /speckit.tasks. Converging without design context means the unbuilt UI work is re-derived from prose alone, so the appended tasks carry no Figma value at all and /speckit.implement then builds from those. Safe no-op when Figma does not apply."

  before_implement:
    command: speckit.figma.ensure
    optional: false
    description: "Refresh the Figma design context before implementation. This is the phase that WRITES the code, so it is the phase where the design rules and the extracted values actually bind — without this hook they are loaded during spec/plan/tasks and absent when the code is produced. Also restores the snapshot on a fresh clone (.figma/cache/ is git-ignored), which is what keeps the agent from improvising a raw Figma MCP call with a node id re-extracted from a URL. Safe no-op when Figma does not apply."

  after_specify:
    command: speckit.figma.verify
    optional: false
    description: "After spec generation, verify the Figma section was integrated (when a mockup was detected) and self-correct if missing. Mandatory (optional: false) so the verification always runs and the agent cannot skip the gate."

  after_plan:
    command: speckit.figma.verify
    optional: false
    description: "After plan generation, verify the Figma plan section was integrated (when a mockup was detected) and self-correct if missing. Mandatory (optional: false) so the verification always runs and the agent cannot skip the gate."

  after_tasks:
    command: speckit.figma.verify
    optional: false
    description: "After tasks generation, verify the Figma tasks section was integrated (when a mockup was detected) and self-correct if missing. Mandatory (optional: false) so the verification always runs and the agent cannot skip the gate."

  after_converge:
    command: speckit.figma.verify
    optional: false
    description: "After convergence, verify the Figma tasks section survived. /speckit.converge REWRITES tasks.md to append the remaining work, and a rewrite is exactly where a section — and the marker every later phase keys on — gets dropped. Same check as after_tasks, on the same document."

  after_analyze:
    command: speckit.figma.drift
    optional: false
    description: "After the consistency analysis, report design drift: the documents can agree perfectly with each other and all three be faithful to a creative the designer has since changed. Compares the Figma lastModified recorded in the spec's section marker with the current snapshot; safe no-op when the feature carries no design section."

tags:
  - figma
  - design
  - frontend
  - ui
  - design-system
